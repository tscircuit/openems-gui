# Builds the desktop app for macOS, Linux and Windows and attaches the installers
# to the GitHub release for a pushed version tag (v0.1.0, ...). install.sh and
# install.ps1 download from the latest such release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, runner: macos-15, args: "--mac zip dmg --arm64" }
          - { name: mac-x64, runner: macos-15-intel, args: "--mac zip dmg --x64" }
          - { name: linux-x64, runner: ubuntu-22.04, args: "--linux tar.gz AppImage --x64" }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, args: "--linux tar.gz --arm64" }
          - { name: win-x64, runner: windows-latest, args: "--win nsis --x64" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Package
        run: bunx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            release/openEMS-GUI-*
            !release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "openEMS GUI $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
